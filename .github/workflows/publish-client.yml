name: Publish reviewed main client
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit with successful Validate portable runtime CI
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-vojeto-client
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Admit existing protected environment and private destination
        env:
          VOJETO_RELEASE_ALLOW_SELF_REVIEW: ${{ vars.VOJETO_RELEASE_ALLOW_SELF_REVIEW }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_IMAGE: ${{ vars.VOJETO_CLIENT_RELEASE_IMAGE }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_policy.py --image "$RELEASE_IMAGE" --expected-sha "$EXPECTED_SHA"
  publish:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    environment: vojeto-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned OCI signing tool
        uses: sigstore/cosign-installer@af595e623eec1ede52d6322f53b635d5def0a95a # pinned action source
        with:
          cosign-release: v3.1.3
      - name: Publish, sign, attest and verify private exact-source OCI image
        env:
          VOJETO_RELEASE_ALLOW_SELF_REVIEW: ${{ vars.VOJETO_RELEASE_ALLOW_SELF_REVIEW }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_IMAGE: ${{ vars.VOJETO_CLIENT_RELEASE_IMAGE }}
          RELEASE_TARGET: release
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_private_image.sh
