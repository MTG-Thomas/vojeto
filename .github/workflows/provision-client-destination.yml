name: Provision private client destination
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed current main; creates only the configured private client package
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-vojeto-client
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify reviewed source, protected approval and destination absence
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_IMAGE: ${{ vars.VOJETO_CLIENT_RELEASE_IMAGE }}
          VOJETO_RELEASE_ALLOW_SELF_REVIEW: ${{ vars.VOJETO_RELEASE_ALLOW_SELF_REVIEW }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/provision_release.py --mode check
  provision:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    environment: vojeto-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_IMAGE: ${{ vars.VOJETO_CLIENT_RELEASE_IMAGE }}
      VOJETO_RELEASE_ALLOW_SELF_REVIEW: ${{ vars.VOJETO_RELEASE_ALLOW_SELF_REVIEW }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build licensed source and provision only the private destination
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/provision_release.py --mode check
          docker build --target release --tag "$RELEASE_IMAGE:bootstrap-$GITHUB_SHA" .
          python3 scripts/provision_release.py --mode check
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$RELEASE_IMAGE:bootstrap-$GITHUB_SHA"
          python3 scripts/provision_release.py --mode verify
          printf '%s\n' 'Private destination provisioned. Bootstrap tag is not a signed release or deployment pin. Run the normal protected client publisher next.' >> "$GITHUB_STEP_SUMMARY"
